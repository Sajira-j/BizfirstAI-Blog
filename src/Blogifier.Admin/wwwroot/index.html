<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizFirst AI</title>
  <base href="/" />
  <!-- BizFirst AI Dark Theme Design Tokens -->
  <style>
    :root {
      /* SURFACE TOKENS */
      --surface-0: #0E1113;      /* Main app background */
      --surface-1: #151A1E;      /* Cards / sections */
      --surface-2: #1B2126;      /* Elevated surfaces (modals, dropdowns) */
      --surface-3: #222A30;      /* Hovered surface */
      --surface-border: #2A3238; /* Borders / dividers */

      /* ACCENT TOKENS */
      --accent-1: #1DB954;             /* Primary brand accent */
      --accent-1-hover: #17A74A;
      --accent-1-active: #148C3E;
      --accent-1-soft: #163D2A;        /* Subtle background tint */
      --accent-1-glow: rgba(29,185,84,0.25);

      /* TEXT TOKENS */
      --text-1: #E6EDF3;        /* Primary text */
      --text-2: #9AA4AE;        /* Secondary text */
      --text-3: #6B7680;        /* Disabled / muted text */
      --text-on-accent: #0E1113;

      /* STATUS TOKENS */
      --status-success: #1DB954;
      --status-warning: #F5A524;
      --status-error: #E5484D;
      --status-info: #3B82F6;

      /* FOCUS & EFFECTS */
      --focus-ring: 0 0 0 3px rgba(29,185,84,0.25);
      --card-radius: 12px;
      --button-radius: 8px;
    }
  </style>
  <link href="admin/css/blogifier.css" rel="stylesheet" />
  <!--
      TODO: for rtl:
      <link href="admin/css/blogifier.rtl.css" rel="stylesheet" />
  -->
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="shortcut icon" type="image/png" href="/img/favicon.png" />
  <meta name="apple-mobile-web-app-title" content="BizFirst AI">
  <meta name="application-name" content="BizFirst AI">
  <meta name="theme-color" content="#1DB954">
</head>

<body>

  <main id="app" class="blogifier">
    <div class="blogifier-loading d-flex">
      <div class="spinner-border text-blogifier m-auto" role="status"></div>
    </div>
  </main>

  <div id="blazor-error-ui" class="blogifier-error">
    <div class="container d-flex align-items-center">
      <p class="blogifier-error-message">An unhandled error has occurred.</p>
      <button class="blogifier-error-btn reload ms-auto" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-arrow-repeat" viewBox="0 0 16 16">
          <path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z" />
          <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z" />
        </svg>
      </button>
      <button class="blogifier-error-btn dismiss" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" class="bi bi-x" viewBox="0 0 16 16">
          <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z" />
        </svg>
      </button>
    </div>
  </div>

  <script src="_framework/blazor.webassembly.js"></script>
  <script src="admin/js/blogifier.js"></script>
</body>
</html>
